<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="minato Writing Studio — シーン管理・AI支援搭載の小説執筆アプリ。端末間データ同期対応。" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="minato ws" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>minato Writing Studio</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0a0e1a;
        color: #c8d8e8;
        font-family: 'Noto Serif JP', 'Georgia', serif;
        height: 100dvh;
        overflow: hidden;
      }
      #root { height: 100dvh; display: flex; flex-direction: column; }
      /* ダークテーマ: 明るさを上げてシステムUIを読みやすく */
      html[data-theme="dark"] #root {
        filter: brightness(2);
      }
      html[data-theme="dark"] img,
      html[data-theme="dark"] video {
        filter: brightness(0.5);
      }
      /* 集中テーマ: 超ダーク（フィルターなし・デフォルトの外観） */
      /* html[data-theme="focus"] #root {} */
      /* ライトテーマ: フィルターベース変換 */
      html[data-theme="light"] #root {
        filter: invert(1) hue-rotate(180deg);
      }
      /* フィルター適用時に画像・動画は再反転 */
      html[data-theme="light"] img,
      html[data-theme="light"] video {
        filter: invert(1) hue-rotate(180deg);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
